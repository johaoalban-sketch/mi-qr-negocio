<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>MJM TECH - Mi QR Negocio v3</title>
<style>
body{margin:0;background:#080808;color:#fff;font-family:Arial}
nav{position:fixed;width:220px;height:100vh;background:#151515;padding:20px}
main{margin-left:260px;padding:30px}
.card{background:#1c1c1c;border-radius:16px;padding:20px;margin:15px 0}
button{background:#f5a400;border:0;padding:12px 20px;border-radius:10px}
</style>
</head>
<body>
<nav>
<h2 style="color:#f5a400">MJM TECH</h2>
<p>Mi QR Negocio</p>
<p>📊 Dashboard</p>
<p>🔳 QR Dinámicos</p>
<p>👥 Clientes</p>
<p>📈 Estadísticas</p>
</nav>
<main>
<h1 style="color:#f5a400">MI QR NEGOCIO v3</h1>
<div class="card">
<h2>Nuevo QR dinámico</h2>
<p>Código: <span id="codigo">MJN-000001</span></p>
<p>Destino actual: Sin asignar</p>

<div id="qr"></div>

<button onclick="crearQR()">Crear QR</button>
</div>
<div class="card">
<h2>Base del sistema</h2>
<p>Preparado para conectar usuarios, clientes y escaneos reales.</p>
</div>
</main>
<script>

function crearQR(){

    let codigo = document.getElementById("codigo").innerText;

    let urlQR = "https://miqrnegociomvp.vercel.app/r/" + codigo;

    document.getElementById("qr").innerHTML =
    `
    <h3>QR generado</h3>

    <img 
    src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${urlQR}">

    <p>${urlQR}</p>
    `;

}

</script> 
</body>
</html>
